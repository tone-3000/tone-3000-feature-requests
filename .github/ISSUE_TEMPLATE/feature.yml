name: Feature request
description: A change you'd like to see on tone3000.com.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        The plugin and the in-browser player have their own repos. Use the links on the previous page for those.

  - type: checkboxes
    id: searched
    attributes:
      label: Search
      options:
        - label: I searched existing issues and this is not a duplicate
          required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard or impossible today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How you would like it to work.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: What you already tried, or another approach you would also accept.

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Search / filters
        - Tone pages
        - Uploading
        - Downloads
        - Accounts / profiles
        - Site content / docs
        - Other
    validations:
      required: true
