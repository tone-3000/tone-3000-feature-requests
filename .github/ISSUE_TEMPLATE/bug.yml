name: Bug report
description: Something on tone3000.com isn't working.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        The plugin and the in-browser player have their own repos. Use the links on the previous page for those.

  - type: checkboxes
    id: searched
    attributes:
      label: Search
      options:
        - label: I searched existing issues and this is not a duplicate
          required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What you clicked, searched, or uploaded before it went wrong.
      placeholder: |
        1. Go to …
        2. Search for / upload …
        3. …
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ## Environment

  - type: input
    id: url
    attributes:
      label: Page URL
      description: The address bar when it went wrong.
      placeholder: https://www.tone3000.com/tones/…
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser
      description: Name and version.
      placeholder: Chrome 140, Safari 18.6, Firefox 142
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: OS
      options:
        - macOS
        - Windows
        - Linux
        - iOS
        - Android
    validations:
      required: true

  - type: input
    id: os-version
    attributes:
      label: OS version
      placeholder: macOS 15.6, Windows 11, Ubuntu 24.04, iOS 18
    validations:
      required: true

  - type: dropdown
    id: device
    attributes:
      label: Device
      options:
        - Desktop or laptop
        - Phone
        - Tablet
    validations:
      required: true

  - type: dropdown
    id: signed-in
    attributes:
      label: Were you signed in?
      options:
        - "Yes"
        - "No"
        - Not sure
    validations:
      required: true

  - type: dropdown
    id: other-browser
    attributes:
      label: Does it happen in another browser too?
      options:
        - "Yes"
        - "No"
        - Did not try
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ## Console errors

        Open your browser's developer tools, reload the page, reproduce the problem, and copy anything in red from the Console tab. That is usually more useful than a screenshot.

  - type: textarea
    id: console
    attributes:
      label: Console output
      description: Paste what the Console tab showed.
      render: shell

  - type: textarea
    id: extras
    attributes:
      label: Screenshots or anything else
      description: Drag images or a screen recording onto this field if it helps show the problem.
